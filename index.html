<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="description" content="Sudophile, le Sudoku qui vous explique. L'indice ne donne pas un chiffre : il nomme un raisonnement." />

    <!--
      L'aperçu des liens partagés.

      Sans ces balises, un défi envoyé par message arrive comme une adresse
      nue : pas de titre, pas d'image, rien qui donne envie de l'ouvrir. Pour
      une fonctionnalité dont tout l'intérêt est de circuler, c'était le
      maillon faible. L'adresse de l'image doit être absolue — les messageries
      ne savent pas résoudre un chemin relatif.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sudophile" />
    <meta property="og:title" content="Sudophile — Le Sudoku qui vous explique" />
    <meta property="og:description" content="Un indice ne donne pas un chiffre. Il nomme un raisonnement." />
    <meta property="og:url" content="https://emilechassagnard-del.github.io/sudoku/" />
    <meta property="og:image" content="https://emilechassagnard-del.github.io/sudoku/partage.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sudophile — Le Sudoku qui vous explique" />
    <meta name="twitter:description" content="Un indice ne donne pas un chiffre. Il nomme un raisonnement." />
    <meta name="twitter:image" content="https://emilechassagnard-del.github.io/sudoku/partage.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sudophile" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icone.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icone.png" />
    <link rel="stylesheet" href="style.css" />
    <title>Sudophile — le Sudoku qui vous explique</title>
    <script>
      /*
        Le thème est posé avant le premier affichage : sans cela, la page
        paraîtrait un instant en clair avant de basculer, et ce clignotement
        est particulièrement désagréable de nuit.

        Trois préférences possibles : "auto" suit le réglage de l'appareil,
        "light" et "sombre" l'ignorent. Le script les résout toujours en une
        valeur concrète, si bien que la feuille de style n'a qu'un seul jeu de
        couleurs sombres à décrire.
      */
      (function () {
        var pref = "auto";
        try {
          pref = localStorage.getItem("sudoku.theme") || "auto";
        } catch (e) {}
        var sombre =
          pref === "dark" ||
          (pref !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", sombre ? "dark" : "light");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", sombre ? "#12161b" : "#f7f8fa");
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <p style="text-align:center;color:#5a6b7c;font-family:Georgia,serif;padding:40px 0">
        Chargement…
      </p>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
